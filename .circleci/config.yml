version: 2.1
orbs:
  node: circleci/node@5.2.0

jobs:
  buildAndTest:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - node/install-packages
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run:
          name: Upload coverage to Codacy
          command: |
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage/lcov.info

  testBun:
    docker:
      - image: oven/bun:latest
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: bun install
      - run:
          name: Run Bun tests (includes hang-on-exit regression check)
          # 30 s timeout catches a hanging process; bun test itself has no --timeout for suite exit
          command: timeout 30 bun test ./test/tests-7z.bun.test.ts

workflows:
  version: 2
  build_and_test:
    jobs:
      - buildAndTest
      - testBun
